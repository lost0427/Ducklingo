[tools]
data_dir = "data/tools"
ffmpeg_release_tag = "autobuild-2026-08-25-13-06"
ffmpeg_variant = "gpl"

[download]
retries = 3
retry_delay_seconds = 2
timeout_seconds = 3600

[upload]
max_file_size_gb = 2
allowed_extensions = ["mp4", "mov", "avi", "mkv", "webm", "m4v", "wav", "mp3", "flac", "m4a"]

[auth]
session_idle_minutes = 120
session_max_days = 14
login_failure_limit = 5
login_lock_minutes = 15
csrf_enabled = true
cookie_secure = false
allowed_origins = ["http://localhost:5173", "http://127.0.0.1:5173"]

[asr]
timeout_seconds = 300
local_timeout_seconds = 3600
retries = 2
chunk_seconds = 600
cloud_concurrency = 4
local_concurrency = 1
max_chunk_mb = 24

[sentence]
max_chars_latin = 42
max_chars_cjk = 21
batch_words = 800
retries = 2
response_format = ""

[translate]
context_window_tokens = 131072
max_context_ratio = 0.8
tokenizer_encoding = "auto"
batch_retries = 2
retry_delay_seconds = 0

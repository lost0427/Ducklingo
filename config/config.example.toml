[tools]
data_dir = "data/tools"
ffmpeg_release_tag = "autobuild-2026-08-25-13-06"
ffmpeg_variant = "gpl"

[download]
retries = 3
retry_delay_seconds = 2
timeout_seconds = 3600

[asr]
timeout_seconds = 300        # cloud 单请求超时
local_timeout_seconds = 3600 # local worker 子进程总超时
retries = 2                  # cloud 单块重试次数
chunk_seconds = 600          # 静音对齐切分目标块长
cloud_concurrency = 4        # cloud 并发上限
local_concurrency = 1        # local 并发上限
max_chunk_mb = 24            # cloud 单请求体预算

[sentence]
max_chars_latin = 42         # 拉丁及非 CJK 脚本最大句长
max_chars_cjk = 21           # CJK 脚本最大句长
batch_words = 800            # LLM 分批词数
retries = 2                  # 单批 LLM 调用重试次数
response_format = ""         # 开关：空=不发送该参数；设置后透传

[translate]
context_window_tokens = 131072 # 默认 128K 上下文窗口
max_context_ratio = 0.8         # 实际请求预算比例，范围 0.1..0.95
tokenizer_encoding = "auto"     # auto 或 tiktoken encoding 名称
batch_retries = 2               # 单批网络/服务重试次数
retry_delay_seconds = 0         # 重试退避基数；生产环境可设为 2

[batch]
download_concurrency = 2        # 批量下载并发上限
llm_concurrency = 20            # 批量断句 + 翻译共用的 LLM 并发上限

[upload]
max_file_size_gb = 2
allowed_extensions = ["mp4", "mov", "avi", "mkv", "webm", "m4v", "wav", "mp3", "flac", "m4a"]

[auth]
session_idle_minutes = 120
session_max_days = 14
login_failure_limit = 5
login_lock_minutes = 15
csrf_enabled = true
cookie_secure = true
allowed_origins = ["http://localhost:5173", "http://127.0.0.1:5173"]

# ASR model URLs match crispasr's built-in registry (registry_lookup),
# except qwen3-asr-0.6b (the imatrix quant is not in the registry); the
# VAD model is the upstream whisper.cpp Silero asset.

[[models]]
id = "silero-vad"
kind = "vad"
name = "Silero VAD"
url = "https://huggingface.co/ggml-org/whisper-vad/resolve/main/ggml-silero-v6.2.0.bin"
